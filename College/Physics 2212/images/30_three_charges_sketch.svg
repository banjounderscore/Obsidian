<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" width="420" height="330" font-family="Arial, Helvetica, sans-serif">
  <rect width="420" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#222"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="30" y1="270" x2="385" y2="270" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="60" y1="300" x2="60" y2="30" stroke="#222" stroke-width="2" marker-end="url(#ah)"/>
  <text x="388" y="289" font-size="16" fill="#222" font-style="italic">x</text>
  <text x="67" y="34" font-size="16" fill="#222" font-style="italic">y</text>

  <!-- rectangle and diagonal -->
  <line x1="60" y1="90" x2="300" y2="90" stroke="#777" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="300" y1="270" x2="300" y2="90" stroke="#777" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="60" y1="270" x2="300" y2="90" stroke="#777" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- distance labels -->
  <text x="172" y="294" font-size="15" fill="#222" text-anchor="middle">4a</text>
  <text x="44" y="185" font-size="15" fill="#222" text-anchor="end">3a</text>
  <text x="160" y="164" font-size="15" fill="#222" text-anchor="middle" transform="rotate(-37 160 164)">5a</text>

  <!-- charges -->
  <circle cx="60" cy="270" r="15" fill="#e74c3c" stroke="#222" stroke-width="1.5"/>
  <text x="60" y="276" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">+</text>
  <text x="76" y="308" font-size="15" fill="#222">q₁ = +2q</text>

  <circle cx="300" cy="270" r="15" fill="#3498db" stroke="#222" stroke-width="1.5"/>
  <text x="300" y="276" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold">−</text>
  <text x="318" y="308" font-size="15" fill="#222">q₂ = −3q</text>

  <circle cx="60" cy="90" r="15" fill="#e74c3c" stroke="#222" stroke-width="1.5"/>
  <text x="60" y="96" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">+</text>
  <text x="82" y="70" font-size="15" fill="#222">q₃ = +4q</text>

  <!-- point P -->
  <circle cx="300" cy="90" r="5" fill="#222"/>
  <text x="312" y="86" font-size="15" fill="#222">P = (4a, 3a)</text>
</svg>
